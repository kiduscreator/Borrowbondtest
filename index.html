    <script>
      // Gracefully silence benign Vite HMR WebSocket disconnection errors in cloud proxy environments
      (function() {
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var msg = (arg && (arg.message || arg.stack)) || String(arg || '');
            if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('[vite] connect failed') !== -1) {
              return;
            }
          }
          origError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
