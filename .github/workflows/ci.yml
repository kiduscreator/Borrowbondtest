name: BorrowBond CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-and-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript type check
        run: npm run lint
      - name: Run unit & integration test suite
        run: npm test
      - name: Build production bundle
        run: npm run build

  near-contract-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/borrowbond
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check NEAR Rust smart contract
        run: cargo check
